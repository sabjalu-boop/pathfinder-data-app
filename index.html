<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS패스파인더</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CS패스파인더">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 네비게이션 SVG 아이콘 전환 효과 */
        .nav-icon { transition: all 0.2s ease-in-out; display: flex; align-items: center; justify-content: center; }
        .nav-active { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); color: #ffffff; }
        .nav-inactive { opacity: 0.5; color: #e2e8f0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- 상단 헤더 및 깔끔한 SVG 아이콘 네비게이션 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <h1 class="text-lg font-bold">CS패스파인더</h1>
        <div class="flex space-x-4 items-center pr-1">
            <!-- 출석표 아이콘 -->
            <button type="button" id="navAttendance" class="nav-icon nav-active p-1" title="출석">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            </button>
            <!-- 칭찬 하트 아이콘 -->
            <button type="button" id="navActivity" class="nav-icon nav-inactive p-1" title="칭찬">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
            <!-- 순위 트로피 아이콘 -->
            <button type="button" id="navRanking" class="nav-icon nav-inactive p-1" title="순위">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 4h2a2 2 0 012 2v1a3 3 0 01-3 3h-1M8 4H6a2 2 0 00-2 2v1a3 3 0 003 3h1M12 14v7m-4 0h8m-8-17h8v7a4 4 0 01-8 0V4z"></path></svg>
            </button>
            <!-- 설정 톱니바퀴 아이콘 -->
            <button type="button" id="navSettings" class="nav-icon nav-inactive p-1" title="설정">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">

        <!-- 설정 패널 -->
        <div id="settingsPanel" class="bg-white p-4 rounded-xl shadow-sm mb-4 hidden border-2 border-blue-500">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script 웹 앱 URL</label>
            <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border p-2 rounded-lg text-sm mb-2 focus:ring-2 focus:ring-blue-400">
            <button type="button" id="btnSaveUrl" class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-semibold">URL 저장 및 불러오기</button>
        </div>

        <!-- 공통 컨트롤 패널 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 space-y-3">
            
            <!-- (1) 출석/칭찬 모드용 날짜 선택 -->
            <div id="dateInputContainer">
                <label class="block text-xs font-semibold text-gray-600 mb-1">체크 날짜 선택</label>
                <input type="date" id="recordDate" class="w-full border p-2 rounded-lg text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- (2) 순위 모드용 기간 선택 -->
            <div id="rankingPeriodContainer" class="hidden space-y-3">
                <label class="block text-xs font-semibold text-gray-600">순위 반영 기간 설정</label>
                
                <!-- 간편 월 선택 -->
                <div class="flex items-center space-x-2">
                    <input type="month" id="rankMonth" class="w-2/3 border p-2 rounded-lg text-sm bg-gray-50">
                    <button type="button" id="btnApplyMonth" class="w-1/3 bg-blue-100 text-blue-700 py-2 rounded-lg text-xs font-bold hover:bg-blue-200">월 적용</button>
                </div>
                
                <!-- 상세 기간 설정 -->
                <div class="flex items-center space-x-2">
                    <input type="date" id="rankStartDate" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                    <span class="text-gray-400 font-bold">~</span>
                    <input type="date" id="rankEndDate" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                </div>
                <button type="button" id="btnLoadRank" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-bold shadow-sm">해당 기간 데이터 조회</button>
            </div>
            
            <!-- 칭찬 항목 선택 영역 -->
            <div id="categoryContainer" class="hidden space-y-2 pt-2 border-t">
                <label class="block text-xs font-semibold text-gray-600">칭찬 항목 선택</label>
                <div id="categoryButtons" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <!-- 회원 검색창 및 정렬 기능 영역 -->
        <div id="searchSortContainer" class="mb-4 space-y-2">
            <input type="text" id="searchInput" placeholder="🔍 회원 이름 검색..." class="w-full border p-3 rounded-xl text-sm bg-white shadow-sm focus:ring-2 focus:ring-blue-400">
            
            <!-- 정렬 버튼 그룹 -->
            <div class="grid grid-cols-5 gap-1">
                <button type="button" id="sortNameAsc" class="py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm">이름순</button>
                <button type="button" id="sortNameDesc" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">이름역순</button>
                <button type="button" id="sortIdAsc" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">ID순</button>
                <button type="button" id="sortIdDesc" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">ID역순</button>
                <button type="button" id="sortCustom" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">Custom</button>
            </div>
        </div>

        <!-- 4열 그리드 회원 타일 영역 -->
        <div id="memberListContainer" class="grid grid-cols-4 gap-2.5">
            <div class="col-span-4 text-center text-gray-400 py-10 text-sm font-bold">앱을 준비하는 중입니다...</div>
        </div>

    </div>

    <!-- 하단 고정 저장 버튼 (순위 모드에서는 숨김) -->
    <div id="footerBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 max-w-md mx-auto shadow-lg z-10 transition-transform transform translate-y-0">
        <button type="button" id="btnSubmit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-center text-sm shadow-md">전송 및 저장하기</button>
    </div>

    <script>
        // 안전한 오류 감지
        window.onerror = function(msg, url, lineNo) {
            var container = document.getElementById('memberListContainer');
            if (container) {
                container.innerHTML = '<div class="col-span-4 text-center text-red-600 py-6 text-xs font-bold bg-red-50 rounded-xl p-3">오류 발생 (' + lineNo + '):<br>' + msg + '</div>';
            }
            return false;
        };

        var memoryStore = {};
        var safeStorage = {
            getItem: function(key) {
                try { return window.localStorage.getItem(key); } 
                catch (e) { return memoryStore[key] || null; }
            },
            setItem: function(key, val) {
                try { window.localStorage.setItem(key, val); } 
                catch (e) { memoryStore[key] = String(val); }
            },
            removeItem: function(key) {
                try { window.localStorage.removeItem(key); } 
                catch (e) { delete memoryStore[key]; }
            }
        };

        var DEFAULT_GAS_URL = "";
        var members = [];
        var currentMode = 'attendance';
        var currentSort = 'name_asc';
        var isCustomSorting = false;
        
        var categories = ['찬양', '태도'];
        try {
            var savedCats = safeStorage.getItem('PATHFINDER_CATS');
            if (savedCats) {
                var parsed = JSON.parse(savedCats);
                if (Array.isArray(parsed) && parsed.length > 0) categories = parsed;
            }
        } catch (e) {}
        var currentCategory = categories[0];

        var categoryColorMap = {
            '찬양': { text: 'text-rose-500', badgeBg: 'bg-rose-50 text-rose-600' },
            '태도': { text: 'text-amber-500', badgeBg: 'bg-amber-50 text-amber-600' }
        };

        // 1자릿수 숫자를 2자릿수로 안전하게 맞춰주는 함수 (구형 기기 호환)
        function pad2(num) {
            return num < 10 ? '0' + num : String(num);
        }

        function getTodayString() {
            var d = new Date();
            return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        }

        function initDates() {
            var elDate = document.getElementById('recordDate');
            if (elDate && !elDate.value) elDate.value = getTodayString();
            
            var d = new Date();
            var monthStr = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
            var rankMonthEl = document.getElementById('rankMonth');
            if (rankMonthEl) rankMonthEl.value = monthStr;
            
            applyRankMonth();
        }

        function applyRankMonth() {
            var mVal = document.getElementById('rankMonth').value;
            if (mVal) {
                var parts = mVal.split('-');
                var year = parseInt(parts[0], 10);
                var month = parseInt(parts[1], 10);
                var lastDay = new Date(year, month, 0); // 그 달의 마지막 날 계산

                document.getElementById('rankStartDate').value = year + '-' + pad2(month) + '-01';
                document.getElementById('rankEndDate').value = year + '-' + pad2(month) + '-' + pad2(lastDay.getDate());
            }
        }

        function getCheckedDate() {
            var el = document.getElementById('recordDate');
            if (!el.value) el.value = getTodayString();
            return el.value;
        }

        function getMemberUniqueKey(m) {
            return String(m.회원ID || '') + '__' + String(m.이름 || '');
        }

        function getCategoryStyle(cat) {
            if (!categoryColorMap[cat]) {
                var palette = [
                    { text: 'text-blue-500', badgeBg: 'bg-blue-50 text-blue-600' },
                    { text: 'text-emerald-500', badgeBg: 'bg-emerald-50 text-emerald-600' },
                    { text: 'text-purple-500', badgeBg: 'bg-purple-50 text-purple-700' }
                ];
                var hash = 0;
                for (var i = 0; i < cat.length; i++) hash += cat.charCodeAt(i);
                categoryColorMap[cat] = palette[hash % palette.length];
            }
            return categoryColorMap[cat];
        }

        function toggleSettings() {
            var panel = document.getElementById('settingsPanel');
            if (panel) {
                if (panel.classList.contains('hidden')) panel.classList.remove('hidden');
                else panel.classList.add('hidden');
            }
        }

        function saveUrl() {
            var input = document.getElementById('scriptUrl');
            var url = input ? input.value.trim() : '';
            if (!url) { alert('URL을 입력해주세요.'); return; }
            safeStorage.setItem('GAS_URL', url);
            var panel = document.getElementById('settingsPanel');
            if (panel) panel.classList.add('hidden');
            loadMembers();
        }

        function setMode(mode) {
            var prevMode = currentMode;
            currentMode = mode;

            // 네비게이션 스타일 갱신
            var navIds = ['navAttendance', 'navActivity', 'navRanking', 'navSettings'];
            navIds.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) {
                    el.classList.remove('nav-active');
                    el.classList.add('nav-inactive');
                }
            });

            var activeEl = null;
            if (mode === 'attendance') activeEl = document.getElementById('navAttendance');
            if (mode === 'activity') activeEl = document.getElementById('navActivity');
            if (mode === 'ranking') activeEl = document.getElementById('navRanking');
            
            if (activeEl) {
                activeEl.classList.remove('nav-inactive');
                activeEl.classList.add('nav-active');
            }

            // UI 영역 토글
            var dateCont = document.getElementById('dateInputContainer');
            var rankCont = document.getElementById('rankingPeriodContainer');
            var catCont = document.getElementById('categoryContainer');
            var footer = document.getElementById('footerBar');

            if (dateCont) {
                if (mode === 'ranking') dateCont.classList.add('hidden');
                else dateCont.classList.remove('hidden');
            }
            if (rankCont) {
                if (mode !== 'ranking') rankCont.classList.add('hidden');
                else rankCont.classList.remove('hidden');
            }
            
            // ★ 수정: 칭찬 탭 진입 시 항목 영역을 보이고 버튼을 그려줌
            if (catCont) {
                if (mode !== 'activity') {
                    catCont.classList.add('hidden');
                } else {
                    catCont.classList.remove('hidden');
                    renderCategoryButtons(); 
                }
            }
            
            if (footer) {
                if (mode === 'ranking') {
                    footer.classList.add('translate-y-full');
                    document.body.classList.remove('pb-24');
                } else {
                    footer.classList.remove('translate-y-full');
                    document.body.classList.add('pb-24');
                }
            }

            // ★ 수정: 일일 데이터(출석/칭찬)와 기간 데이터(순위) 간의 탭 이동 시에는 무조건 데이터를 다시 불러옴
            var isNowRanking = (mode === 'ranking');
            var wasRanking = (prevMode === 'ranking');

            if (isNowRanking !== wasRanking) {
                loadMembers(); 
            } else {
                updateSortButtonsUI();
                applySorting();
                filterMembers();
            }
        }

        function updateSortButtonsUI() {
            ['sortNameAsc', 'sortNameDesc', 'sortIdAsc', 'sortIdDesc', 'sortCustom'].forEach(function(id) {
                var btn = document.getElementById(id);
                if (btn) btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600";
            });
            var customBtn = document.getElementById('sortCustom');
            if (customBtn) customBtn.innerText = "Custom";

            if (isCustomSorting) {
                if (customBtn) {
                    customBtn.innerText = "완료";
                    customBtn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-amber-500 text-white shadow-sm animate-pulse";
                }
            } else {
                if (currentSort === 'name_asc') document.getElementById('sortNameAsc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
                if (currentSort === 'name_desc') document.getElementById('sortNameDesc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
                if (currentSort === 'id_asc') document.getElementById('sortIdAsc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
                if (currentSort === 'id_desc') document.getElementById('sortIdDesc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
                if (currentSort === 'custom') document.getElementById('sortCustom').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
            }
        }

        function setSort(sortType) {
            isCustomSorting = false;
            currentSort = sortType;
            safeStorage.setItem('PATHFINDER_SORT_MODE', sortType);
            updateSortButtonsUI();
            applySorting();
            filterMembers();
        }

        function toggleCustomSort() {
            isCustomSorting = !isCustomSorting;
            if (isCustomSorting) {
                currentSort = 'custom';
                safeStorage.setItem('PATHFINDER_SORT_MODE', 'custom');
            }
            updateSortButtonsUI();
            apply
