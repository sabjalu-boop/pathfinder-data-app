<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS패스파인더</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CS패스파인더">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- 상단 헤더 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-lg font-bold">CS패스파인더</h1>
        <div class="space-x-1">
            <button onclick="loadMembers()" class="text-xs bg-blue-700 px-2.5 py-1.5 rounded-lg">새로고침</button>
            <button onclick="toggleSettings()" class="text-xs bg-blue-700 px-2.5 py-1.5 rounded-lg">설정</button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">

        <!-- 설정 패널 -->
        <div id="settingsPanel" class="bg-white p-4 rounded-xl shadow-sm mb-4 hidden">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script 웹 앱 URL</label>
            <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border p-2 rounded-lg text-sm mb-2">
            <button onclick="saveUrl()" class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-semibold">URL 저장 및 새로고침</button>
        </div>

        <!-- 모임 정보 입력 카드 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">체크 날짜 선택</label>
                <input type="date" id="recordDate" onchange="loadMembers()" class="w-full border p-2 rounded-lg text-sm bg-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">모드 선택</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnAttendance" onclick="setMode('attendance')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm">출석 체크</button>
                    <button type="button" id="btnActivity" onclick="setMode('activity')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">칭찬</button>
                    <button type="button" id="btnDailyRank" onclick="setMode('daily-rank')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">일일 순위</button>
                    <button type="button" id="btnOverallRank" onclick="setMode('overall-rank')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">전체 순위</button>
                </div>
            </div>
            
            <!-- 칭찬 항목 선택 영역 -->
            <div id="categoryContainer" class="hidden space-y-2 pt-1">
                <label class="block text-xs font-semibold text-gray-600">칭찬 항목 선택</label>
                <div id="categoryButtons" class="flex flex-wrap gap-1.5">
                    <!-- 자바스크립트로 버튼 생성 -->
                </div>
            </div>
        </div>

        <!-- 회원 검색창 -->
        <div id="searchContainer" class="mb-4">
            <input type="text" id="searchInput" oninput="filterMembers()" placeholder="🔍 회원 이름 검색..." class="w-full border p-3 rounded-xl text-sm bg-white shadow-sm">
        </div>

        <!-- 회원 목록 영역 -->
        <div id="memberListContainer" class="space-y-3">
            <div class="text-center text-gray-400 py-10 text-sm">데이터를 불러오는 중입니다...</div>
        </div>

    </div>

    <!-- 하단 고정 저장 버튼 -->
    <div id="footerBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 max-w-md mx-auto shadow-lg">
        <button onclick="submitData()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-center">전송 및 저장하기</button>
    </div>

    <script>
        let members = [];
        let currentMode = 'attendance';
        
        let categories = JSON.parse(localStorage.getItem('PATHFINDER_CATS')) || ['찬양', '태도'];
        let currentCategory = categories[0];

        // 카테고리별 고유 색상 팔레트 정의
        const categoryColorMap = {
            '찬양': { text: 'text-rose-500', badgeBg: 'bg-rose-50 text-rose-600 border border-rose-200' },
            '태도': { text: 'text-amber-500', badgeBg: 'bg-amber-50 text-amber-600 border border-amber-200' }
        };

        function getCategoryStyle(cat) {
            if (!categoryColorMap[cat]) {
                const palette = [
                    { text: 'text-blue-500', badgeBg: 'bg-blue-50 text-blue-600 border border-blue-200' },
                    { text: 'text-emerald-500', badgeBg: 'bg-emerald-50 text-emerald-600 border border-emerald-200' },
                    { text: 'text-purple-500', badgeBg: 'bg-purple-50 text-purple-600 border border-purple-200' },
                    { text: 'text-teal-500', badgeBg: 'bg-teal-50 text-teal-600 border border-teal-200' },
                    { text: 'text-indigo-500', badgeBg: 'bg-indigo-50 text-indigo-600 border border-indigo-200' }
                ];
                let hash = 0;
                for (let i = 0; i < cat.length; i++) hash += cat.charCodeAt(i);
                categoryColorMap[cat] = palette[hash % palette.length];
            }
            return categoryColorMap[cat];
        }

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('recordDate');
            if (dateInput) dateInput.value = today;

            const savedUrl = localStorage.getItem('GAS_URL');
            if (savedUrl) {
                document.getElementById('scriptUrl').value = savedUrl;
                setTimeout(loadMembers, 100);
            } else {
                document.getElementById('settingsPanel').classList.remove('hidden');
                document.getElementById('memberListContainer').innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">우측 상단 [설정]에서 구글 스크립트 URL을 입력해주세요.</div>';
            }
        };

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function saveUrl() {
            const url = document.getElementById('scriptUrl').value.trim();
            if (!url) {
                alert('URL을 입력해주세요.');
                return;
            }
            localStorage.setItem('GAS_URL', url);
            alert('저장되었습니다!');
            location.reload();
        }

        function setMode(mode) {
            currentMode = mode;
            const btnAtt = document.getElementById('btnAttendance');
            const btnAct = document.getElementById('btnActivity');
            const btnDaily = document.getElementById('btnDailyRank');
            const btnOverall = document.getElementById('btnOverallRank');
            const catContainer = document.getElementById('categoryContainer');
            const footerBar = document.getElementById('footerBar');

            [btnAtt, btnAct, btnDaily, btnOverall].forEach(btn => {
                btn.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600";
            });

            if (mode === 'attendance') {
                btnAtt.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.remove('hidden');
            } else if (mode === 'activity') {
                btnAct.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.remove('hidden');
                renderCategoryButtons();
                footerBar.classList.remove('hidden');
            } else if (mode === 'daily-rank') {
                btnDaily.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
            } else if (mode === 'overall-rank') {
                btnOverall.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
            }

            if (members.length > 0) {
                const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
                const filtered = keyword ? members.filter(m => m.이름.toLowerCase().includes(keyword)) : members;
                renderMembers(filtered);
            }
        }

        function renderCategoryButtons() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = cat;
                if (cat === currentCategory) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200';
                }
                btn.onclick = () => {
                    currentCategory = cat;
                    renderCategoryButtons();
                    renderMembers(members);
                };
                container.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.innerText = '+ 추가';
            addBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100';
            addBtn.onclick = addNewCategory;
            container.appendChild(addBtn);
        }

        function addNewCategory() {
            const newCat = prompt('추가할 새로운 칭찬 항목 이름을 입력하세요:');
            if (newCat && newCat.trim() !== '') {
                const trimmed = newCat.trim();
                if (!categories.includes(trimmed)) {
                    categories.push(trimmed);
                    localStorage.setItem('PATHFINDER_CATS', JSON.stringify(categories));
                    currentCategory = trimmed;
                    renderCategoryButtons();
                    renderMembers(members);
                } else {
                    alert('이미 존재하는 항목입니다.');
                }
            }
        }

        async function loadMembers() {
            const url = localStorage.getItem('GAS_URL');
            if (!url) return;
            const recordDate = document.getElementById('recordDate').value;

            const container = document.getElementById('memberListContainer');
            container.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">회원 명부를 불러오는 중...</div>';

            try {
                const response = await fetch(`${url}?date=${recordDate}`);
                if (!response.ok) throw new Error('서버 응답이 올바르지 않습니다.');
                members = await response.json();
                
                if (!Array.isArray(members) || members.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">등록된 회원이 없습니다.</div>';
                    return;
                }

                renderMembers(members);
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="text-center text-red-400 py-10 text-sm">로드 실패: ${error.message}</div>`;
            }
        }

        function filterMembers() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = members.filter(m => m.이름 && m.이름.toLowerCase().includes(keyword));
            renderMembers(filtered);
        }

        function renderMembers(list) {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">검색된 회원이 없습니다.</div>';
                return;
            }

            if (currentMode === 'daily-rank') {
                list.sort((a, b) => {
                    const aAtt = a.attendanceStatus === '출석' ? 1 : 0;
                    const bAtt = b.attendanceStatus === '출석' ? 1 : 0;
                    if (bAtt !== aAtt) return bAtt - aAtt;
                    return (b.dailyScore || 0) - (a.dailyScore || 0);
                });
            } else if (currentMode === 'overall-rank') {
                list.sort((a, b) => {
                    if ((b.attendanceRate || 0) !== (a.attendanceRate || 0)) {
                        return (b.attendanceRate || 0) - (a.attendanceRate || 0);
                    }
                    return (b.overallScore || 0) - (a.overallScore || 0);
                });
            }

            list.forEach((m, index) => {
                const originalIndex = members.findIndex(item => item.회원ID === m.회원ID);
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm flex items-center justify-between';

                let controlHtml = '';
                let middleHtml = ''; // 이름과 조절 버튼 사이의 공간 (하트 스티커 혹은 순위 정보)

                if (currentMode === 'attendance') {
                    const isAlreadyChecked = m.attendanceStatus === '출석';
                    const isChecked = isAlreadyChecked ? 'checked' : '';
                    const isDisabled = isAlreadyChecked ? 'disabled' : '';
                    const badgeText = isAlreadyChecked ? '출석완료' : '출석';
                    const cursorStyle = isAlreadyChecked ? 'cursor-not-allowed opacity-75' : 'cursor-pointer';

                    controlHtml = `
                        <label class="relative inline-flex items-center ${cursorStyle}">
                            <input type="checkbox" id="att_${originalIndex}" ${isChecked} ${isDisabled} class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            <span class="ml-2 text-sm font-medium ${isAlreadyChecked ? 'text-blue-600 font-bold' : 'text-gray-700'}">${badgeText}</span>
                        </label>
                    `;
                } else if (currentMode === 'activity') {
                    // 칭찬 모드: 이름과 - + 버튼 사이에 하트 스티커 누적 표현
                    let heartsContainer = '<div class="flex flex-col gap-1 px-2 flex-grow overflow-x-auto">';
                    let allCats = new Set([...Object.keys(m.activityCounts || {}), ...Object.keys(m.tempActivityCounts || {})]);
                    
                    if (allCats.size === 0) {
                        heartsContainer += '<span class="text-xs text-gray-300">칭찬 내역 없음</span>';
                    } else {
                        allCats.forEach(cat => {
                            let saved = (m.activityCounts && m.activityCounts[cat]) || 0;
                            let temp = (m.tempActivityCounts && m.tempActivityCounts[cat]) || 0;
                            let total = saved + temp;
                            if (total > 0) {
                                let style = getCategoryStyle(cat);
                                let hearts = '';
                                for (let h = 0; h < total; h++) {
                                    hearts += `<svg class="w-3.5 h-3.5 ${style.text} inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                                }
                                heartsContainer += `
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${style.badgeBg}">${cat}</span>
                                        <div class="flex items-center flex-wrap">${hearts}</div>
                                    </div>
                                `;
                            }
                        });
                    }
                    heartsContainer += '</div>';
                    middleHtml = heartsContainer;

                    if (!m.tempActivityCounts) m.tempActivityCounts = {};
                    const currentCount = m.tempActivityCounts[currentCategory] || 0;

                    controlHtml = `
                        <div class="flex items-center space-x-2 flex-shrink-0">
                            <button type="button" onclick="adjustCount(${originalIndex}, -1)" class="w-8 h-8 bg-gray-100 rounded-lg font-bold text-gray-600">-</button>
                            <span id="cnt_${originalIndex}" class="w-8 text-center font-bold">${currentCount}</span>
                            <button type="button" onclick="adjustCount(${originalIndex}, 1)" class="w-8 h-8 bg-blue-100 text-blue-600 rounded-lg font-bold">+</button>
                        </div>
                    `;
                } else if (currentMode === 'daily-rank') {
                    const rankBadge = `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-bold mr-2">${index + 1}위</span>`;
                    const attBadge = m.attendanceStatus === '출석' ? '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">출석완료</span>' : '<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">미출석</span>';
                    const scoreBadge = `<span class="text-[10px] bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full font-bold">당일 칭찬: ${m.dailyScore || 0}개</span>`;

                    controlHtml = `
                        <div class="flex items-center space-x-1.5">
                            ${attBadge}
                            ${scoreBadge}
                        </div>
                    `;
                    middleHtml = `<div class="flex items-center">${rankBadge}</div>`;
                } else if (currentMode === 'overall-rank') {
                    const rankBadge = `<span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded-full font-bold mr-2">${index + 1}위</span>`;
                    const rateBadge = `<span class="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-bold">출석률: ${m.attendanceRate || 0}%</span>`;
                    const totalScoreBadge = `<span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold">전체 칭찬: ${m.overallScore || 0}개</span>`;

                    controlHtml = `
                        <div class="flex items-center space-x-1.5">
                            ${rateBadge}
                            ${totalScoreBadge}
                        </div>
                    `;
                    middleHtml = `<div class="flex items-center">${rankBadge}</div>`;
                }

                card.innerHTML = `
                    <div class="flex items-center flex-shrink-0">
                        <div>
                            <div class="font-bold text-gray-800">
                                <span>${m.이름 || '이름 없음'}</span>
                            </div>
                            <div class="text-xs text-gray-400 mt-0.5">${m.회원ID || ''}</div>
                        </div>
                    </div>
                    ${currentMode === 'activity' || currentMode === 'daily-rank' || currentMode === 'overall-rank' ? middleHtml : ''}
                    ${controlHtml}
                `;
                container.appendChild(card);
            });
        }

        function adjustCount(index, delta) {
            if (!members[index].tempActivityCounts) members[index].tempActivityCounts = {};
            if (!members[index].tempActivityCounts[currentCategory]) members[index].tempActivityCounts[currentCategory] = 0;
            
            members[index].tempActivityCounts[currentCategory] += delta;
            if (members[index].tempActivityCounts[currentCategory] < 0) {
                members[index].tempActivityCounts[currentCategory] = 0;
            }
            
            const count = members[index].tempActivityCounts[currentCategory];
            const cntSpan = document.getElementById(`cnt_${index}`);
            if (cntSpan) cntSpan.innerText = count;
        }

        async function submitData() {
            const url = localStorage.getItem('GAS_URL');
            const customDate = document.getElementById('recordDate').value;

            if (!customDate) {
                alert('체크할 날짜를 선택해주세요.');
                return;
            }

            let queryUrl = `${url}?date=${customDate}`;

            if (currentMode === 'attendance') {
                let records = [];
                members.forEach((m, index) => {
                    if (m.attendanceStatus === '출석') return; 

                    const checkbox = document.getElementById(`att_${index}`);
                    const isChecked = checkbox ? checkbox.checked : false;
                    if (isChecked) {
                        records.push({
                            memberId: m.회원ID,
                            name: m.이름,
                            status: '출석'
                        });
                    }
                });

                if (records.length === 0) {
                    alert('새로 체크된 출석 인원이 없습니다.');
                    return;
                }

                queryUrl += `&action=attendance&records=${encodeURIComponent(JSON.stringify(records))}`;
            } else if (currentMode === 'activity') {
                let records = [];
                members.forEach((m, index) => {
                    const count = (m.tempActivityCounts && m.tempActivityCounts[currentCategory]) ? m.tempActivityCounts[currentCategory] : 0;
                    if (count > 0) {
                        records.push({
                            memberId: m.회원ID,
                            name: m.이름,
                            count: count
                        });
                    }
                });

                if (records.length === 0) {
                    alert(`[${currentCategory}] 항목에서 횟수가 0보다 큰 회원이 없습니다.`);
                    return;
                }

                queryUrl += `&action=activity&activityName=${encodeURIComponent(currentCategory)}&records=${encodeURIComponent(JSON.stringify(records))}`;
            }

            try {
                const response = await fetch(queryUrl);
                const result = await response.json();
                if (result.status === 'success') {
                    alert('성공적으로 저장되었습니다!');
                    members.forEach(m => { if (m.tempActivityCounts) m.tempActivityCounts = {}; });
                    loadMembers(); 
                } else {
                    alert('저장 실패: ' + (result.message || '알 수 없는 오류'));
                }
            } catch (error) {
                alert('통신 중 오류가 발생했습니다: ' + error);
            }
        }
    </script>
</body>
</html>
