<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS패스파인더</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CS패스파인더">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- 상단 헤더 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-lg font-bold">CS패스파인더</h1>
        <div class="space-x-1">
            <button onclick="loadMembers()" class="text-xs bg-blue-700 px-2.5 py-1.5 rounded-lg">새로고침</button>
            <button onclick="toggleSettings()" class="text-xs bg-blue-700 px-2.5 py-1.5 rounded-lg">설정</button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">

        <!-- 설정 패널 -->
        <div id="settingsPanel" class="bg-white p-4 rounded-xl shadow-sm mb-4 hidden">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script 웹 앱 URL</label>
            <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border p-2 rounded-lg text-sm mb-2">
            <button onclick="saveUrl()" class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-semibold">URL 저장 및 새로고침</button>
        </div>

        <!-- 모임 정보 입력 카드 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">체크 날짜 선택</label>
                <input type="date" id="recordDate" onchange="loadMembers()" class="w-full border p-2 rounded-lg text-sm bg-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">모드 선택</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnAttendance" onclick="setMode('attendance')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm">출석 체크</button>
                    <button type="button" id="btnActivity" onclick="setMode('activity')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">칭찬</button>
                    <button type="button" id="btnDailyRank" onclick="setMode('daily-rank')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">일일 순위</button>
                    <button type="button" id="btnOverallRank" onclick="setMode('overall-rank')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">전체 순위</button>
                </div>
            </div>
            
            <!-- 칭찬 항목 선택 영역 -->
            <div id="categoryContainer" class="hidden space-y-2 pt-1">
                <label class="block text-xs font-semibold text-gray-600">칭찬 항목 선택</label>
                <div id="categoryButtons" class="flex flex-wrap gap-1.5">
                    <!-- 자바스크립트로 버튼 생성 -->
                </div>
            </div>
        </div>

        <!-- 회원 검색창 -->
        <div id="searchContainer" class="mb-4">
            <input type="text" id="searchInput" oninput="filterMembers()" placeholder="🔍 회원 이름 검색..." class="w-full border p-3 rounded-xl text-sm bg-white shadow-sm">
        </div>

        <!-- 4열 그리드 회원 타일 영역 -->
        <div id="memberListContainer" class="grid grid-cols-4 gap-2.5">
            <div class="col-span-4 text-center text-gray-400 py-10 text-sm">데이터를 불러오는 중입니다...</div>
        </div>

    </div>

    <!-- 하단 고정 저장 버튼 -->
    <div id="footerBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 max-w-md mx-auto shadow-lg z-10">
        <button onclick="submitData()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-center text-sm shadow-md">전송 및 저장하기</button>
    </div>

    <script>
        let members = [];
        let currentMode = 'attendance';
        
        let categories = JSON.parse(localStorage.getItem('PATHFINDER_CATS')) || ['찬양', '태도'];
        let currentCategory = categories[0];

        const categoryColorMap = {
            '찬양': { text: 'text-rose-500', badgeBg: 'bg-rose-50 text-rose-600' },
            '태도': { text: 'text-amber-500', badgeBg: 'bg-amber-50 text-amber-600' }
        };

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 즉시 오늘 날짜 세팅 안전장치
        (function() {
            const dateInput = document.getElementById('recordDate');
            if (dateInput) {
                dateInput.value = getTodayString();
            }
        })();

        function getCategoryStyle(cat) {
            if (!categoryColorMap[cat]) {
                const palette = [
                    { text: 'text-blue-500', badgeBg: 'bg-blue-50 text-blue-600' },
                    { text: 'text-emerald-500', badgeBg: 'bg-emerald-50 text-emerald-600' },
                    { text: 'text-purple-500', badgeBg: 'bg-purple-50 text-purple-700' },
                    { text: 'text-teal-500', badgeBg: 'bg-teal-50 text-teal-600' },
                    { text: 'text-indigo-500', badgeBg: 'bg-indigo-50 text-indigo-600' }
                ];
                let hash = 0;
                for (let i = 0; i < cat.length; i++) hash += cat.charCodeAt(i);
                categoryColorMap[cat] = palette[hash % palette.length];
            }
            return categoryColorMap[cat];
        }

        window.onload = function() {
            const dateInput = document.getElementById('recordDate');
            if (dateInput && !dateInput.value) {
                dateInput.value = getTodayString();
            }

            const savedUrl = localStorage.getItem('GAS_URL');
            if (savedUrl) {
                document.getElementById('scriptUrl').value = savedUrl;
                setTimeout(loadMembers, 100);
            } else {
                document.getElementById('settingsPanel').classList.remove('hidden');
                document.getElementById('memberListContainer').innerHTML = '<div class="col-span-4 text-center text-gray-400 py-10 text-sm">우측 상단 [설정]에서 구글 스크립트 URL을 입력해주세요.</div>';
            }
        };

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function saveUrl() {
            const url = document.getElementById('scriptUrl').value.trim();
            if (!url) {
                alert('URL을 입력해주세요.');
                return;
            }
            localStorage.setItem('GAS_URL', url);
            alert('저장되었습니다!');
            location.reload();
        }

        function setMode(mode) {
            currentMode = mode;
            const btnAtt = document.getElementById('btnAttendance');
            const btnAct = document.getElementById('btnActivity');
            const btnDaily = document.getElementById('btnDailyRank');
            const btnOverall = document.getElementById('btnOverallRank');
            const catContainer = document.getElementById('categoryContainer');
            const footerBar = document.getElementById('footerBar');

            [btnAtt, btnAct, btnDaily, btnOverall].forEach(btn => {
                btn.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600";
            });

            if (mode === 'attendance') {
                btnAtt.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.remove('hidden');
            } else if (mode === 'activity') {
                btnAct.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.remove('hidden');
                renderCategoryButtons();
                footerBar.classList.remove('hidden');
            } else if (mode === 'daily-rank') {
                btnDaily.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
            } else if (mode === 'overall-rank') {
                btnOverall.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
            }

            if (members.length > 0) {
                const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
                const filtered = keyword ? members.filter(m => m.이름.toLowerCase().includes(keyword)) : members;
                renderMembers(filtered);
            }
        }

        function renderCategoryButtons() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = cat;
                if (cat === currentCategory) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200';
                }
                btn.onclick = () => {
                    currentCategory = cat;
                    renderCategoryButtons();
                    renderMembers(members);
                };
                container.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.innerText = '+ 추가';
            addBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100';
            addBtn.onclick = addNewCategory;
            container.appendChild(addBtn);
        }

        function addNewCategory() {
            const newCat = prompt('추가할 새로운 칭찬 항목 이름을 입력하세요:');
            if (newCat && newCat.trim() !== '') {
                const trimmed = newCat.trim();
                if (!categories.includes(trimmed)) {
                    categories.push(trimmed);
                    localStorage.setItem('PATHFINDER_CATS', JSON.stringify(categories));
                    currentCategory = trimmed;
                    renderCategoryButtons();
                    renderMembers(members);
                } else {
                    alert('이미 존재하는 항목입니다.');
                }
            }
        }

        async function loadMembers() {
            const url = localStorage.getItem('GAS_URL');
            if (!url) return;
            
            let recordDateInput = document.getElementById('recordDate');
            let recordDate = recordDateInput ? recordDateInput.value : '';
            
            if (!recordDate) {
                recordDate = getTodayString();
                if (recordDateInput) recordDateInput.value = recordDate;
            }

            const container = document.getElementById('memberListContainer');
            container.innerHTML = '<div class="col-span-4 text-center text-gray-400 py-10 text-sm">회원 명부를 불러오는 중...</div>';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);

            try {
                const response = await fetch(`${url}?date=${recordDate}`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error('서버 응답이 올바르지 않습니다.');
                members = await response.json();
                
                if (!Array.isArray(members) || members.length === 0) {
                    container.innerHTML = '<div class="col-span-4 text-center text-gray-400 py-10 text-sm">등록된 회원이 없습니다.</div>';
                    return;
                }

                members.forEach((m, idx) => {
                    m._uniqueIndex = idx;
                    m.attendanceChecked = (m.attendanceStatus === '출석');
                    if (!m.tempActivityCounts) m.tempActivityCounts = {};
                });

                renderMembers(members);
            } catch (error) {
                clearTimeout(timeoutId);
                console.error(error);
                if (error.name === 'AbortError') {
                    container.innerHTML = '<div class="col-span-4 text-center text-red-400 py-10 text-sm">로드 실패: 서버 응답 시간이 초과되었습니다. URL을 확인해주세요.</div>';
                } else {
                    container.innerHTML = `<div class="col-span-4 text-center text-red-400 py-10 text-sm">로드 실패: ${error.message}</div>`;
                }
            }
        }

        function filterMembers() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = members.filter(m => m.이름 && m.이름.toLowerCase().includes(keyword));
            renderMembers(filtered);
        }

        function toggleAttendanceCard(originalIndex) {
            if (members[originalIndex].attendanceStatus === '출석') return; 
            members[originalIndex].attendanceChecked = !members[originalIndex].attendanceChecked;
            
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = keyword ? members.filter(m => m.이름.toLowerCase().includes(keyword)) : members;
            renderMembers(filtered);
        }

        function toggleActivityCard(originalIndex) {
            if (!members[originalIndex].tempActivityCounts) {
                members[originalIndex].tempActivityCounts = {};
            }
            let currentVal = members[originalIndex].tempActivityCounts[currentCategory] || 0;
            members[originalIndex].tempActivityCounts[currentCategory] = currentVal + 1;
            
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = keyword ? members.filter(m => m.이름.toLowerCase().includes(keyword)) : members;
            renderMembers(filtered);
        }

        function renderMembers(list) {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="col-span-4 text-center text-gray-400 py-10 text-sm">검색된 회원이 없습니다.</div>';
                return;
            }

            if (currentMode === 'daily-rank') {
                list.sort((a, b) => {
                    const aAtt = a.attendanceStatus === '출석' ? 1 : 0;
                    const bAtt = b.attendanceStatus === '출석' ? 1 : 0;
                    if (bAtt !== aAtt) return bAtt - aAtt;
                    return (b.dailyScore || 0) - (a.dailyScore || 0);
                });
            } else if (currentMode === 'overall-rank') {
                list.sort((a, b) => {
                    if ((b.attendanceRate || 0) !== (a.attendanceRate || 0)) {
                        return (b.attendanceRate || 0) - (a.attendanceRate || 0);
                    }
                    return (b.overallScore || 0) - (a.overallScore || 0);
                });
            }

            list.forEach((m) => {
                const originalIndex = m._uniqueIndex;
                const tile = document.createElement('div');

                let subTextHtml = '';
                let tileClass = '';

                if (currentMode === 'attendance') {
                    const isAlreadyChecked = m.attendanceStatus === '출석';
                    
                    if (isAlreadyChecked) {
                        tileClass = 'bg-gray-100 border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center text-center opacity-70 h-24';
                        subTextHtml = `<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold mt-1">출석완료</span>`;
                    } else {
                        const isChecked = m.attendanceChecked;
                        if (isChecked) {
                            tileClass = 'bg-blue-50 border-2 border-blue-500 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer shadow-sm transition-all h-24';
                            subTextHtml = `<span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold mt-1">출석 ✓</span>`;
                        } else {
                            tileClass = 'bg-white border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer hover:border-gray-300 shadow-sm transition-all h-24';
                            subTextHtml = `<span class="text-[10px] text-gray-400 mt-1">미체크</span>`;
                        }
                        tile.onclick = () => toggleAttendanceCard(originalIndex);
                    }
                } else if (currentMode === 'activity') {
                    let tempCount = (m.tempActivityCounts && m.tempActivityCounts[currentCategory]) ? m.tempActivityCounts[currentCategory] : 0;

                    if (tempCount > 0) {
                        tileClass = 'bg-blue-50 border-2 border-blue-500 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer shadow-sm transition-all h-24';
                        subTextHtml = `<span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold mt-1">+${tempCount}개</span>`;
                    } else {
                        tileClass = 'bg-white border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer hover:border-gray-300 shadow-sm transition-all h-24';
                        subTextHtml = `<span class="text-[10px] text-gray-400 mt-1">미체크</span>`;
                    }
                    tile.onclick = () => toggleActivityCard(originalIndex);

                    // 누적 칭찬(하트/숫자) 표시 요약
                    let saved = (m.activityCounts && m.activityCounts[currentCategory]) || 0;
                    let total = saved + tempCount;
                    if (total > 0) {
                        let style = getCategoryStyle(currentCategory);
                        if (total <= 3) {
                            let hearts = '';
                            for (let h = 0; h < total; h++) {
                                hearts += `<svg class="w-3 h-3 ${style.text} inline-block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                            }
                            subTextHtml += `<div class="flex items-center justify-center mt-0.5">${hearts}</div>`;
                        } else {
                            subTextHtml += `<div class="text-[10px] font-bold ${style.text} mt-0.5">❤️ ${total}</div>`;
                        }
                    }

                } else {
                    tileClass = 'bg-white border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center text-center shadow-sm h-24';

                    if (currentMode === 'daily-rank') {
                        const rankIndex = list.indexOf(m) + 1;
                        const rankBadge = `<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-full font-bold mb-1">${rankIndex}위</span>`;
                        const scoreBadge = `<span class="text-[10px] text-purple-700 font-bold mt-1">칭찬: ${m.dailyScore || 0}</span>`;
                        subTextHtml = `${rankBadge}${scoreBadge}`;
                    } else if (currentMode === 'overall-rank') {
                        const rankIndex = list.indexOf(m) + 1;
                        const rankBadge = `<span class="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded-full font-bold mb-1">${rankIndex}위</span>`;
                        const rateBadge = `<span class="text-[10px] text-blue-700 font-bold mt-1">출석 ${m.attendanceRate || 0}%</span>`;
                        subTextHtml = `${rankBadge}${rateBadge}`;
                    }
                }

                tile.className = tileClass;
                tile.innerHTML = `
                    <div class="font-bold text-xs text-gray-800 truncate w-full px-1">
                        ${m.이름 || '이름 없음'}
                    </div>
                    <div class="text-[10px] text-gray-400 truncate w-full">${m.회원ID || ''}</div>
                    ${subTextHtml}
                `;
                container.appendChild(tile);
            });
        }

        async function submitData() {
            const url = localStorage.getItem('GAS_URL');
            let recordDate = document.getElementById('recordDate').value;

            if (!recordDate) {
                recordDate = getTodayString();
                document.getElementById('recordDate').value = recordDate;
            }

            let queryUrl = `${url}?date=${recordDate}`;

            if (currentMode === 'attendance') {
                let records = [];
                members.forEach((m) => {
                    if (m.attendanceStatus === '출석') return; 

                    if (m.attendanceChecked) {
                        records.push({
                            memberId: m.회원ID,
                            name: m.이름,
                            status: '출석'
                        });
                    }
                });

                if (records.length === 0) {
                    alert('새로 체크된 출석 인원이 없습니다.');
                    return;
                }

                queryUrl += `&action=attendance&records=${encodeURIComponent(JSON.stringify(records))}`;
            } else if (currentMode === 'activity') {
                let records = [];
                members.forEach((m) => {
                    const count = (m.tempActivityCounts && m.tempActivityCounts[currentCategory]) ? m.tempActivityCounts[currentCategory] : 0;
                    if (count > 0) {
                        records.push({
                            memberId: m.회원ID,
                            name: m.이름,
                            count: count
                        });
                    }
                });

                if (records.length === 0) {
                    alert(`[${currentCategory}] 항목에서 칭찬 스티커가 체크된 회원이 없습니다.`);
                    return;
                }

                queryUrl += `&action=activity&activityName=${encodeURIComponent(currentCategory)}&records=${encodeURIComponent(JSON.stringify(records))}`;
            }

            try {
                const response = await fetch(queryUrl);
                const result = await response.json();
                if (result.status === 'success') {
                    alert('성공적으로 저장되었습니다!');
                    
                    members.forEach(m => { 
                        if (currentMode === 'attendance' && m.attendanceChecked) {
                            m.attendanceStatus = '출석';
                        }
                        if (currentMode === 'activity' && m.tempActivityCounts) {
                            if (!m.activityCounts) m.activityCounts = {};
                            if (m.tempActivityCounts[currentCategory]) {
                                m.activityCounts[currentCategory] = (m.activityCounts[currentCategory] || 0) + m.tempActivityCounts[currentCategory];
                                m.tempActivityCounts[currentCategory] = 0;
                            }
                        }
                    });
                    
                    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
                    const filtered = keyword ? members.filter(m => m.이름.toLowerCase().includes(keyword)) : members;
                    renderMembers(filtered);
                } else {
                    alert('저장 실패: ' + (result.message || '알 수 없는 오류'));
                }
            } catch (error) {
                alert('통신 중 오류가 발생했습니다: ' + error);
            }
        }
    </script>
</body>
</html>
