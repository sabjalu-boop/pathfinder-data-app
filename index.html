<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS패스파인더</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CS패스파인더">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- 상단 헤더 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-lg font-bold">CS패스파인더</h1>
        <div class="space-x-1">
            <button onclick="loadMembers()" class="text-xs bg-blue-700 px-2.5 py-1.5 rounded-lg">새로고침</button>
            <button onclick="toggleSettings()" class="text-xs bg-blue-700 px-2.5 py-1.5 rounded-lg">설정</button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">

        <!-- 설정 패널 -->
        <div id="settingsPanel" class="bg-white p-4 rounded-xl shadow-sm mb-4 hidden">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script 웹 앱 URL</label>
            <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border p-2 rounded-lg text-sm mb-2">
            <button onclick="saveUrl()" class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-semibold">URL 저장 및 새로고침</button>
        </div>

        <!-- 모임 정보 입력 카드 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">체크 날짜 선택</label>
                <input type="date" id="recordDate" onchange="loadMembers()" class="w-full border p-2 rounded-lg text-sm bg-white">
                <script>
                    (function() {
                        const d = new Date();
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        const el = document.getElementById('recordDate');
                        if (el) el.value = `${year}-${month}-${day}`;
                    })();
                </script>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">모드 선택</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnAttendance" onclick="setMode('attendance')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm">출석 체크</button>
                    <button type="button" id="btnActivity" onclick="setMode('activity')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">칭찬</button>
                    <button type="button" id="btnDailyRank" onclick="setMode('daily-rank')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">일일 순위</button>
                    <button type="button" id="btnOverallRank" onclick="setMode('overall-rank')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600">전체 순위</button>
                </div>
            </div>
            
            <!-- 칭찬 항목 선택 영역 -->
            <div id="categoryContainer" class="hidden space-y-2 pt-1">
                <label class="block text-xs font-semibold text-gray-600">칭찬 항목 선택</label>
                <div id="categoryButtons" class="flex flex-wrap gap-1.5">
                    <!-- 자바스크립트로 버튼 생성 -->
                </div>
            </div>
        </div>

        <!-- 회원 검색창 및 정렬 기능 영역 -->
        <div class="mb-4 space-y-2">
            <input type="text" id="searchInput" oninput="filterMembers()" placeholder="🔍 회원 이름 검색..." class="w-full border p-3 rounded-xl text-sm bg-white shadow-sm">
            
            <!-- 정렬 버튼 그룹 -->
            <div class="grid grid-cols-5 gap-1">
                <button type="button" id="sortNameAsc" onclick="setSort('name_asc')" class="py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm">이름순</button>
                <button type="button" id="sortNameDesc" onclick="setSort('name_desc')" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">이름역순</button>
                <button type="button" id="sortIdAsc" onclick="setSort('id_asc')" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">ID순</button>
                <button type="button" id="sortIdDesc" onclick="setSort('id_desc')" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">ID역순</button>
                <button type="button" id="sortCustom" onclick="toggleCustomSort()" class="py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600">Custom</button>
            </div>
        </div>

        <!-- 4열 그리드 회원 타일 영역 -->
        <div id="memberListContainer" class="grid grid-cols-4 gap-2.5">
            <div class="col-span-4 text-center text-gray-400 py-10 text-sm">앱을 준비하는 중입니다...</div>
        </div>

    </div>

    <!-- 하단 고정 저장 버튼 -->
    <div id="footerBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 max-w-md mx-auto shadow-lg z-10">
        <button onclick="submitData()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-center text-sm shadow-md">전송 및 저장하기</button>
    </div>

    <script>
        let members = [];
        let currentMode = 'attendance';
        let currentSort = 'name_asc';
        let isCustomSorting = false;
        
        let categories = ['찬양', '태도'];
        try {
            const savedCats = localStorage.getItem('PATHFINDER_CATS');
            if (savedCats) {
                const parsed = JSON.parse(savedCats);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    categories = parsed;
                }
            }
        } catch (e) {
            console.error("카테고리 로드 오류:", e);
        }
        let currentCategory = categories[0];

        const categoryColorMap = {
            '찬양': { text: 'text-rose-500', badgeBg: 'bg-rose-50 text-rose-600' },
            '태도': { text: 'text-amber-500', badgeBg: 'bg-amber-50 text-amber-600' }
        };

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getCheckedDate() {
            const dateInput = document.getElementById('recordDate');
            let val = dateInput ? dateInput.value : '';
            if (!val) {
                val = getTodayString();
                if (dateInput) dateInput.value = val;
            }
            return val;
        }

        function getCategoryStyle(cat) {
            if (!categoryColorMap[cat]) {
                const palette = [
                    { text: 'text-blue-500', badgeBg: 'bg-blue-50 text-blue-600' },
                    { text: 'text-emerald-500', badgeBg: 'bg-emerald-50 text-emerald-600' },
                    { text: 'text-purple-500', badgeBg: 'bg-purple-50 text-purple-700' },
                    { text: 'text-teal-500', badgeBg: 'bg-teal-50 text-teal-600' },
                    { text: 'text-indigo-500', badgeBg: 'bg-indigo-50 text-indigo-600' }
                ];
                let hash = 0;
                for (let i = 0; i < cat.length; i++) hash += cat.charCodeAt(i);
                categoryColorMap[cat] = palette[hash % palette.length];
            }
            return categoryColorMap[cat];
        }

        // 앱 초기화 로직 (window.onload 대신 DOMContentLoaded 사용)
        function initApp() {
            try {
                getCheckedDate();
                const savedUrl = localStorage.getItem('GAS_URL');
                
                if (savedUrl && savedUrl.trim() !== '') {
                    document.getElementById('scriptUrl').value = savedUrl;
                    loadMembers(); 
                } else {
                    document.getElementById('settingsPanel').classList.remove('hidden');
                    document.getElementById('memberListContainer').innerHTML = '<div class="col-span-4 text-center text-gray-500 py-10 text-sm font-bold">우측 상단 [설정]에서 구글 스크립트 URL을 입력하고 저장해주세요.</div>';
                }
            } catch (err) {
                document.getElementById('memberListContainer').innerHTML = `<div class="col-span-4 text-center text-red-500 py-10 text-sm">초기화 오류: ${err.message}</div>`;
            }
        }

        // 스크립트가 읽히는 즉시 또는 DOM 로드 직후 실행 보장
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function saveUrl() {
            const url = document.getElementById('scriptUrl').value.trim();
            if (!url) {
                alert('URL을 입력해주세요.');
                return;
            }
            localStorage.setItem('GAS_URL', url);
            alert('저장되었습니다!');
            location.reload();
        }

        function setMode(mode) {
            currentMode = mode;
            const btnAtt = document.getElementById('btnAttendance');
            const btnAct = document.getElementById('btnActivity');
            const btnDaily = document.getElementById('btnDailyRank');
            const btnOverall = document.getElementById('btnOverallRank');
            const catContainer = document.getElementById('categoryContainer');
            const footerBar = document.getElementById('footerBar');

            [btnAtt, btnAct, btnDaily, btnOverall].forEach(btn => {
                btn.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-gray-100 text-gray-600";
            });

            if (mode === 'attendance') {
                btnAtt.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.remove('hidden');
            } else if (mode === 'activity') {
                btnAct.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.remove('hidden');
                renderCategoryButtons();
                footerBar.classList.remove('hidden');
            } else if (mode === 'daily-rank') {
                btnDaily.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
            } else if (mode === 'overall-rank') {
                btnOverall.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-sm";
                catContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
            }

            filterMembers();
        }

        function setSort(sortType) {
            isCustomSorting = false;
            const customBtn = document.getElementById('sortCustom');
            if (customBtn) {
                customBtn.innerText = "Custom";
                customBtn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600";
            }

            currentSort = sortType;
            ['sortNameAsc', 'sortNameDesc', 'sortIdAsc', 'sortIdDesc'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600";
            });

            if (sortType === 'name_asc') document.getElementById('sortNameAsc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
            if (sortType === 'name_desc') document.getElementById('sortNameDesc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
            if (sortType === 'id_asc') document.getElementById('sortIdAsc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";
            if (sortType === 'id_desc') document.getElementById('sortIdDesc').className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-sm";

            applySorting();
            filterMembers();
        }

        function toggleCustomSort() {
            isCustomSorting = !isCustomSorting;
            const customBtn = document.getElementById('sortCustom');

            ['sortNameAsc', 'sortNameDesc', 'sortIdAsc', 'sortIdDesc'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600";
            });

            if (isCustomSorting) {
                customBtn.innerText = "완료";
                customBtn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-amber-500 text-white shadow-sm animate-pulse";
            } else {
                customBtn.innerText = "Custom";
                customBtn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-gray-100 text-gray-600";
            }
            filterMembers();
        }

        // 인덱스가 아닌 고유 _uniqueIndex로 사람을 찾아 정확히 이동
        function moveMember(uniqueId, direction) {
            const currentIndex = members.findIndex(m => m._uniqueIndex === uniqueId);
            if (currentIndex === -1) return;

            const targetIndex = currentIndex + direction;
            if (targetIndex < 0 || targetIndex >= members.length) return;

            const temp = members[currentIndex];
            members[currentIndex] = members[targetIndex];
            members[targetIndex] = temp;

            const orderIds = members.map(m => String(m.회원ID));
            localStorage.setItem('PATHFINDER_CUSTOM_ORDER', JSON.stringify(orderIds));

            filterMembers();
        }

        // 타일 클릭 시 출석 토글 (고유 _uniqueIndex로 정확히 대상 탐색)
        function toggleAttendanceCard(uniqueId) {
            if (isCustomSorting) return;
            const member = members.find(m => m._uniqueIndex === uniqueId);
            if (!member) return;
            if (member.attendanceStatus === '출석') return; 
            
            member.attendanceChecked = !member.attendanceChecked;
            filterMembers();
        }

        // 타일 클릭 시 칭찬 +1 추가 (고유 _uniqueIndex로 정확히 대상 탐색)
        function toggleActivityCard(uniqueId) {
            if (isCustomSorting) return;
            const member = members.find(m => m._uniqueIndex === uniqueId);
            if (!member) return;

            if (!member.tempActivityCounts) member.tempActivityCounts = {};
            let currentVal = member.tempActivityCounts[currentCategory] || 0;
            member.tempActivityCounts[currentCategory] = currentVal + 1;
            filterMembers();
        }

        // 칭찬 스티커 취소 (-) 기능 (고유 _uniqueIndex로 탐색)
        function changeActivityCount(uniqueId, delta) {
            const member = members.find(m => m._uniqueIndex === uniqueId);
            if (!member) return;
            if (!member.tempActivityCounts) member.tempActivityCounts = {};

            let currentTemp = member.tempActivityCounts[currentCategory] || 0;
            let saved = (member.activityCounts && member.activityCounts[currentCategory]) || 0;

            if (saved + currentTemp + delta < 0) return;

            member.tempActivityCounts[currentCategory] = currentTemp + delta;
            filterMembers();
        }

        function renderCategoryButtons() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = cat;
                if (cat === currentCategory) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200';
                }
                btn.onclick = () => {
                    currentCategory = cat;
                    renderCategoryButtons();
                    filterMembers();
                };
                container.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.innerText = '+ 추가';
            addBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100';
            addBtn.onclick = addNewCategory;
            container.appendChild(addBtn);
        }

        function addNewCategory() {
            const newCat = prompt('추가할 새로운 칭찬 항목 이름을 입력하세요:');
            if (newCat && newCat.trim() !== '') {
                const trimmed = newCat.trim();
                if (!categories.includes(trimmed)) {
                    categories.push(trimmed);
                    localStorage.setItem('PATHFINDER_CATS', JSON.stringify(categories));
                    currentCategory = trimmed;
                    renderCategoryButtons();
                    filterMembers();
                } else {
                    alert('이미 존재하는 항목입니다.');
                }
            }
        }

        async function loadMembers() {
            const url = localStorage.getItem('GAS_URL');
            if (!url || url.trim() === '') {
                document.getElementById('memberListContainer').innerHTML = '<div class="col-span-4 text-center text-gray-500 py-10 text-sm font-bold">우측 상단 [설정]에서 구글 스크립트 URL을 정확히 입력해주세요.</div>';
                return;
            }
            
            let recordDate = getCheckedDate();

            const container = document.getElementById('memberListContainer');
            // 로딩 메시지 변경 (이 메시지가 보이면 통신 시작된 것임)
            container.innerHTML = '<div class="col-span-4 text-center text-blue-500 py-10 text-sm font-bold animate-pulse">회원 명부를 서버에서 불러오는 중입니다...</div>';

            const controller = new AbortController();
            // 타임아웃 15초로 넉넉하게 연장
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(`${url}?date=${recordDate}`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`서버 응답 오류 (상태코드: ${response.status})`);
                members = await response.json();
                
                if (!Array.isArray(members) || members.length === 0) {
                    container.innerHTML = '<div class="col-span-4 text-center text-gray-400 py-10 text-sm">등록된 회원이 없습니다.</div>';
                    return;
                }

                members.forEach((m, idx) => {
                    m._uniqueIndex = idx;
                    m.attendanceChecked = (m.attendanceStatus === '출석');
                    if (!m.tempActivityCounts) m.tempActivityCounts = {};
                });

                const savedOrder = localStorage.getItem('PATHFINDER_CUSTOM_ORDER');
                if (savedOrder) {
                    try {
                        const orderIds = JSON.parse(savedOrder);
                        members.sort((a, b) => {
                            let ia = orderIds.indexOf(String(a.회원ID));
                            let ib = orderIds.indexOf(String(b.회원ID));
                            if (ia === -1) ia = 9999;
                            if (ib === -1) ib = 9999;
                            return ia - ib;
                        });
                    } catch (e) {
                        applySorting();
                    }
                } else {
                    applySorting();
                }

                filterMembers();
            } catch (error) {
                clearTimeout(timeoutId);
                console.error(error);
                if (error.name === 'AbortError') {
                    container.innerHTML = '<div class="col-span-4 text-center text-red-500 py-10 text-sm font-bold">로드 실패: 서버 응답 시간(15초) 초과. URL이나 네트워크를 확인하세요.</div>';
                } else {
                    container.innerHTML = `<div class="col-span-4 text-center text-red-500 py-10 text-sm font-bold">로드 실패: ${error.message}</div>`;
                }
            }
        }

        function applySorting() {
            if (currentMode !== 'daily-rank' && currentMode !== 'overall-rank') {
                members.sort((a, b) => {
                    if (currentSort === 'name_asc') {
                        return (a.이름 || '').localeCompare(b.이름 || '');
                    } else if (currentSort === 'name_desc') {
                        return (b.이름 || '').localeCompare(a.이름 || '');
                    } else if (currentSort === 'id_asc') {
                        return String(a.회원ID || '').localeCompare(String(b.회원ID || ''), undefined, {numeric: true});
                    } else if (currentSort === 'id_desc') {
                        return String(b.회원ID || '').localeCompare(String(a.회원ID || ''), undefined, {numeric: true});
                    }
                    return 0;
                });
            }
        }

        function filterMembers() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            let list = members.filter(m => m.이름 && m.이름.toLowerCase().includes(keyword));
            renderMembers(list);
        }

        function renderMembers(list) {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="col-span-4 text-center text-gray-400 py-10 text-sm">검색된 회원이 없습니다.</div>';
                return;
            }

            if (currentMode === 'daily-rank') {
                list.sort((a, b) => {
                    const aAtt = a.attendanceStatus === '출석' ? 1 : 0;
                    const bAtt = b.attendanceStatus === '출석' ? 1 : 0;
                    if (bAtt !== aAtt) return bAtt - aAtt;
                    return (b.dailyScore || 0) - (a.dailyScore || 0);
                });
            } else if (currentMode === 'overall-rank') {
                list.sort((a, b) => {
                    if ((b.attendanceRate || 0) !== (a.attendanceRate || 0)) {
                        return (b.attendanceRate || 0) - (a.attendanceRate || 0);
                    }
                    return (b.overallScore || 0) - (a.overallScore || 0);
                });
            }

            list.forEach((m) => {
                const uniqueId = m._uniqueIndex;
                const tile = document.createElement('div');
                tile.style.position = 'relative'; 

                let subTextHtml = '';
                let tileClass = 'bg-white border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-between text-center shadow-sm h-24 select-none';

                if (isCustomSorting) {
                    tileClass = 'bg-amber-50 border-2 border-amber-400 p-2 rounded-xl flex flex-col items-center justify-between text-center shadow-md h-24 select-none';
                    subTextHtml = `
                        <div class="flex items-center justify-between w-full px-1" onclick="event.stopPropagation()">
                            <button type="button" onclick="event.stopPropagation(); moveMember(${uniqueId}, -1)" class="w-6 h-6 bg-white border text-gray-700 rounded text-xs font-bold shadow-sm flex items-center justify-center hover:bg-gray-100">◀</button>
                            <span class="text-[9px] font-bold text-amber-700">이동</span>
                            <button type="button" onclick="event.stopPropagation(); moveMember(${uniqueId}, 1)" class="w-6 h-6 bg-white border text-gray-700 rounded text-xs font-bold shadow-sm flex items-center justify-center hover:bg-gray-100">▶</button>
                        </div>
                    `;
                } else if (currentMode === 'attendance') {
                    const isAlreadyChecked = m.attendanceStatus === '출석';
                    
                    if (isAlreadyChecked) {
                        tileClass = 'bg-gray-100 border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-between text-center opacity-70 h-24 select-none';
                        subTextHtml = `<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold mt-1">출석완료</span>`;
                    } else {
                        const isChecked = m.attendanceChecked;
                        if (isChecked) {
                            tileClass = 'bg-blue-50 border-2 border-blue-500 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer shadow-sm transition-all h-24 select-none';
                            subTextHtml = `<span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold mt-1">출석 ✓</span>`;
                        } else {
                            tileClass = 'bg-white border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer hover:border-gray-300 shadow-sm transition-all h-24 select-none';
                            subTextHtml = `<span class="text-[10px] text-gray-400 mt-1">미체크</span>`;
                        }
                        // 타일 전체 터치 시 출석 변경
                        tile.onclick = () => toggleAttendanceCard(uniqueId);
                    }
                } else if (currentMode === 'activity') {
                    let tempCount = (m.tempActivityCounts && m.tempActivityCounts[currentCategory]) ? m.tempActivityCounts[currentCategory] : 0;
                    let saved = (m.activityCounts && m.activityCounts[currentCategory]) || 0;
                    let total = saved + tempCount;

                    if (tempCount > 0) {
                        tileClass = 'bg-blue-50 border-2 border-blue-500 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer shadow-sm transition-all h-24 select-none relative';
                    } else {
                        tileClass = 'bg-white border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer hover:border-gray-300 shadow-sm transition-all h-24 select-none relative';
                    }
                    
                    // 타일을 탭하면 칭찬 스티커 1개 추가
                    tile.onclick = () => toggleActivityCard(uniqueId);

                    let heartsContainer = '';
                    if (total > 0) {
                        let style = getCategoryStyle(currentCategory);
                        if (total <= 3) {
                            let hearts = '';
                            for (let h = 0; h < total; h++) {
                                hearts += `<svg class="w-3 h-3 ${style.text} inline-block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                            }
                            heartsContainer = `<div class="flex items-center justify-center mt-1">${hearts}</div>`;
                        } else {
                            heartsContainer = `<div class="text-[10px] font-bold ${style.text} mt-1">❤️ ${total}</div>`;
                        }
                    } else {
                        heartsContainer = `<span class="text-[10px] text-gray-400 mt-1">미체크</span>`;
                    }

                    // 왼쪽 하단 스티커 빼기(-) 버튼 (취소용) - 1개 이상 있을 때만 표시
                    let minusBtn = '';
                    if (total > 0) {
                        minusBtn = `<button type="button" onclick="event.stopPropagation(); changeActivityCount(${uniqueId}, -1)" class="absolute bottom-1.5 left-1.5 w-5 h-5 bg-white border border-gray-200 text-red-500 rounded text-xs font-bold flex items-center justify-center hover:bg-red-50 shadow-sm z-10">-</button>`;
                    }

                    subTextHtml = `
                        <div class="w-full flex flex-col items-center pointer-events-none">
                            ${heartsContainer}
                            ${tempCount > 0 ? `<span class="text-[9px] font-bold text-blue-600 mt-0.5">+${tempCount}</span>` : ''}
                        </div>
                        ${minusBtn}
                    `;
                } else {
                    if (currentMode === 'daily-rank') {
                        const rankIndex = list.indexOf(m) + 1;
                        const rankBadge = `<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-full font-bold mb-1">${rankIndex}위</span>`;
                        const scoreBadge = `<span class="text-[10px] text-purple-700 font-bold mt-1">칭찬: ${m.dailyScore || 0}</span>`;
                        subTextHtml = `${rankBadge}${scoreBadge}`;
                    } else if (currentMode === 'overall-rank') {
                        const rankIndex = list.indexOf(m) + 1;
                        const rankBadge = `<span class="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded-full font-bold mb-1">${rankIndex}위</span>`;
                        const rateBadge = `<span class="text-[10px] text-blue-700 font-bold mt-1">출석 ${m.attendanceRate || 0}%</span>`;
                        subTextHtml = `${rankBadge}${rateBadge}`;
                    }
                }

                tile.className = tileClass;
                tile.innerHTML = `
                    <div class="font-bold text-xs text-gray-800 truncate w-full px-1 pointer-events-none mt-1">
                        ${m.이름 || '이름 없음'}
                    </div>
                    <div class="text-[10px] text-gray-400 truncate w-full pointer-events-none">${m.회원ID || ''}</div>
                    ${subTextHtml}
                `;
                container.appendChild(tile);
            });
        }

        async function submitData() {
            const url = localStorage.getItem('GAS_URL');
            let recordDate = getCheckedDate();

            let queryUrl = `${url}?date=${recordDate}`;

            if (currentMode === 'attendance') {
                let records = [];
                members.forEach((m) => {
                    if (m.attendanceStatus === '출석') return; 

                    if (m.attendanceChecked) {
                        records.push({
                            memberId: m.회원ID,
                            name: m.이름,
                            status: '출석'
                        });
                    }
                });

                if (records.length === 0) {
                    alert('새로 체크된 출석 인원이 없습니다.');
                    return;
                }

                queryUrl += `&action=attendance&records=${encodeURIComponent(JSON.stringify(records))}`;
            } else if (currentMode === 'activity') {
                let records = [];
                members.forEach((m) => {
                    const count = (m.tempActivityCounts && m.tempActivityCounts[currentCategory]) ? m.tempActivityCounts[currentCategory] : 0;
                    if (count !== 0) {
                        records.push({
                            memberId: m.회원ID,
                            name: m.이름,
                            count: count
                        });
                    }
                });

                if (records.length === 0) {
                    alert(`[${currentCategory}] 항목에서 변경된 칭찬 스티커 내역이 없습니다.`);
                    return;
                }

                queryUrl += `&action=activity&activityName=${encodeURIComponent(currentCategory)}&records=${encodeURIComponent(JSON.stringify(records))}`;
            }

            try {
                const response = await fetch(queryUrl);
                const result = await response.json();
                if (result.status === 'success') {
                    alert('성공적으로 저장되었습니다!');
                    
                    members.forEach(m => { 
                        if (currentMode === 'attendance' && m.attendanceChecked) {
                            m.attendanceStatus = '출석';
                        }
                        if (currentMode === 'activity' && m.tempActivityCounts) {
                            if (!m.activityCounts) m.activityCounts = {};
                            if (m.tempActivityCounts[currentCategory]) {
                                m.activityCounts[currentCategory] = (m.activityCounts[currentCategory] || 0) + m.tempActivityCounts[currentCategory];
                                m.tempActivityCounts[currentCategory] = 0;
                            }
                        }
                    });
                    
                    filterMembers();
                } else {
                    alert('저장 실패: ' + (result.message || '알 수 없는 오류'));
                }
            } catch (error) {
                alert('통신 중 오류가 발생했습니다: ' + error);
            }
        }
    </script>
